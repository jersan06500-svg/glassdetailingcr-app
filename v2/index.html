<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140609">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GlassDetailingCR · Ruta</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Roboto+Slab:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="gsap.min.js"></script>
<style>
:root{--bg:#140609;--s1:#1F0A0F;--s2:#2B0F16;--ln:#3A1A21;--w:#7F011F;--r:#FF4D6D;--c:#EDF1F5;--m:#B7A6AB;--d:#9A898E;--q:"Questrial",system-ui,sans-serif;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--c);font-family:"Roboto Slab",Georgia,serif;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.q{font-family:var(--q)}
.m{color:var(--m)}
.hide{display:none!important}
svg{display:block}
.press{transition:transform .12s}
.press:active{transform:scale(.96)}

/* ENTRADA */
#login{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column}
#login .road{position:absolute;inset:0;width:100%;height:100%}
#login .glow{position:absolute;left:0;right:0;top:0;height:55%;background:radial-gradient(60% 50% at 52% 45%,rgba(255,77,109,.22),rgba(20,6,9,0) 70%)}
#login .brand{position:relative;margin-top:calc(18vh + var(--safe-t));display:flex;flex-direction:column;align-items:center;gap:18px}
#login .brand img{width:220px;height:auto}
#login .brand p{margin:0;font-family:var(--q);font-size:30px;line-height:1.15;text-align:center}
#login .bot{position:relative;margin-top:auto;padding:0 24px calc(40px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:14px}
.gbtn{width:100%;max-width:420px;height:58px;border-radius:29px;background:var(--c);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:500}
#lmsg{min-height:20px;font-size:13px;color:var(--r);text-align:center}

/* RUTA */
#app{position:fixed;inset:0;overflow:hidden}
#scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#top{position:absolute;left:12px;right:12px;top:calc(12px + var(--safe-t));z-index:5;padding:12px;border-radius:24px;background:rgba(43,15,22,.92);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;justify-content:space-between;align-items:center;padding-left:4px}
#mes{display:flex;align-items:center;gap:6px;height:44px;font-family:var(--q);font-size:19px}
#me{width:44px;height:44px;border-radius:22px;border:1px solid var(--ln);background:var(--s2);font-family:var(--q);font-size:17px}
#week{display:flex;gap:2px;touch-action:pan-y}
.day{flex:1;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--m)}
.day b{font-family:var(--q);font-weight:400;font-size:17px;color:var(--c)}
.day small{font-size:10px}
.day.sel{background:var(--w);color:var(--c)}
.day.hoy:not(.sel){box-shadow:inset 0 0 0 1.5px var(--ln)}
.dots{display:flex;gap:2px;height:4px}
.dots i{width:4px;height:4px;border-radius:2px;background:var(--r)}
.day.sel .dots i{background:var(--c)}
.sum{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:8px 4px 0;border-top:1px solid var(--ln)}
.sum>div:first-child{min-width:0}
.sum .big{font-family:var(--q);font-size:30px;line-height:1.05;white-space:nowrap}
.sum .de{font-size:13px;color:var(--m);font-family:var(--q);white-space:nowrap}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:var(--m);text-align:right}
.meta span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin:0 4px 2px}
.bar i{display:block;height:100%;width:0;background:var(--r);border-radius:3px}
#net{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--bg);font-size:12px;color:var(--m)}

#road{position:relative;min-height:100%}
#road svg.rd{position:absolute;left:0;top:0}
.dot{position:absolute;left:48px;width:24px;height:24px;border-radius:12px;background:var(--bg);border:3px solid var(--d)}
.dot.ok{border-color:var(--c)}
.car{position:absolute;left:38px;width:44px;height:44px;border-radius:22px;background:var(--r);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(255,77,109,.45);z-index:2}
.stop{position:absolute;left:104px;right:12px;padding:10px 10px 10px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--ln);display:flex;align-items:center;gap:10px}
.stop .t{display:flex;gap:8px;align-items:baseline}
.stop .t b{font-family:var(--q);font-weight:400;font-size:18px}
.stop .t small{font-size:11px}
.stop .n{font-size:12px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;flex:none;border-radius:14px;background:var(--s2);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center}
.next{position:absolute;left:104px;right:12px;padding:14px;border-radius:22px;background:var(--w);display:flex;flex-direction:column;gap:10px}
.next .h{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em}
.next .h span:last-child{letter-spacing:0;font-size:12px}
.next .who{font-family:var(--q);font-size:23px;line-height:1.1}
.next .sub{font-size:12px;color:rgba(237,241,245,.85)}
.next .acts{display:flex;gap:8px}
.next .acts a,.next .acts button{flex:1;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}
.next .waze{background:var(--c);color:var(--w);font-weight:600}
.next .go{flex:1.4!important;background:rgba(20,6,9,.35)}
.mins{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:11px;color:rgba(237,241,245,.85)}
.mins button{height:32px;padding:0 10px;white-space:nowrap;border-radius:16px;background:rgba(20,6,9,.35);font-size:12px}
.mins button.on{background:var(--c);color:var(--w)}
.llegue{height:44px;border-radius:14px;border:1px solid rgba(237,241,245,.35);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.empty{position:absolute;left:104px;right:12px;padding:18px;border-radius:22px;background:var(--s1);border:1px dashed var(--ln);display:flex;flex-direction:column;gap:10px}

#island{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);height:62px;padding:0 8px;border-radius:31px;background:rgba(43,15,22,.94);border:1px solid var(--ln);display:flex;align-items:center;gap:6px;z-index:10;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#island button{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--m)}
#island .on{background:var(--c);color:var(--w)}
#island .add{background:var(--w);color:var(--c)}

#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);opacity:0;z-index:20;max-width:86%;padding:12px 18px;border-radius:16px;background:var(--c);color:var(--bg);font-size:14px;text-align:center;pointer-events:none}
#sheet{position:fixed;inset:0;z-index:15;display:flex;align-items:flex-end;background:rgba(0,0,0,.5)}
#sheet .in{width:100%;padding:12px 20px calc(28px + var(--safe-b));border-radius:28px 28px 0 0;background:var(--s1);border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:12px}
#sheet .grab{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--ln)}
.btn{height:54px;border-radius:27px;background:var(--w);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--s2);border:1px solid var(--ln);font-weight:400}
#demo{padding:6px 12px;border-radius:12px;background:var(--bg);font-size:12px;color:var(--m);text-align:center}

/* VISTAS: PARADA Y COBRO */
.view{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);z-index:8}
.vin{padding:calc(84px + var(--safe-t)) 20px calc(120px + var(--safe-b));display:flex;flex-direction:column;gap:16px;max-width:520px;margin:0 auto}
.vhead{position:fixed;left:12px;right:12px;top:calc(12px + var(--safe-t));height:60px;padding:0 8px 0 4px;border-radius:30px;background:rgba(43,15,22,.92);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:6px;z-index:9;max-width:540px;margin:0 auto}
.vhead .tt{flex:1;font-family:var(--q);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.timer{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--w);font-family:var(--q);font-size:15px}
.timer i{width:7px;height:7px;border-radius:4px;background:var(--c)}
.carhd{display:flex;gap:14px;align-items:center}
.carhd .ph{width:76px;height:76px;border-radius:18px;object-fit:cover;background:var(--s2);display:flex;align-items:center;justify-content:center;flex:none}
.steps{padding:6px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--ln)}
.st{position:relative;display:flex;align-items:center;gap:12px;height:56px}
.st .b{width:24px;height:24px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;z-index:1}
.st.ok .b{background:var(--c);border-color:var(--c)}
.st.on .b{background:var(--r);border-color:var(--r);box-shadow:0 0 0 6px rgba(255,77,109,.2)}
.st .l{flex:1;font-size:14px;color:var(--d)}
.st.ok .l,.st.on .l{color:var(--c)}
.st .s{font-size:12px;color:var(--m)}
.st.on .s{color:var(--r)}
.st:not(:last-child)::after{content:"";position:absolute;left:11px;top:40px;height:32px;border-left:2px dashed var(--d)}
.st.ok:not(:last-child)::after{border-left:2px solid var(--c)}
.sec{display:flex;flex-direction:column;gap:8px}
.sech{display:flex;justify-content:space-between;align-items:baseline}
.sech b{font-family:var(--q);font-weight:400;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph3{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--s2)}
.ph3 img{width:100%;height:100%;object-fit:cover;display:block}
.ph3 em{position:absolute;left:6px;bottom:6px;font-style:normal;font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(20,6,9,.75)}
.addph{aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--ln);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--m);font-size:11px;cursor:pointer}
.addph input{display:none}
.ck{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font-size:14px;text-align:left;width:100%}
.ck .bx{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--d);display:flex;align-items:center;justify-content:center;flex:none}
.ck.on .bx{background:var(--w);border-color:var(--w)}
.ck.on span:last-child{color:var(--m);text-decoration:line-through}
.vfoot{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(24px + var(--safe-b));background:linear-gradient(180deg,rgba(20,6,9,0),var(--bg) 35%);display:flex;gap:10px;z-index:9;max-width:560px;margin:0 auto}
.vfoot .btn{flex:1}
.note{font-size:12px;color:var(--m);padding:10px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--ln)}
.comp{position:relative;height:320px;margin:calc(-84px - var(--safe-t)) -20px 0;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.comp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.comp .bf{position:absolute;inset:0;overflow:hidden}
.comp .bf img{width:100vw;max-width:560px}
.comp .ln{position:absolute;top:0;bottom:0;width:2px;background:var(--c);transform:translateX(-1px)}
.comp .kn{position:absolute;top:58%;width:44px;height:44px;border-radius:22px;background:var(--c);color:var(--w);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.comp .fd{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,6,9,0) 60%,var(--bg));pointer-events:none}
.comp .ta{position:absolute;bottom:18px;font-size:11px;padding:3px 9px;border-radius:9px}
.tot{display:flex;justify-content:space-between;align-items:flex-end}
.tot .big{font-family:var(--q);font-size:52px;line-height:1.05}
.seg{display:flex;gap:6px;padding:5px;border-radius:18px;background:var(--s1);border:1px solid var(--ln)}
.seg button{flex:1;height:44px;border-radius:14px;color:var(--m);font-size:13px}
.seg button.on{background:var(--w);color:var(--c)}
.sinpe{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--ln)}
.tg{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 14px;border-radius:16px;background:var(--s1);border:1px solid var(--ln);width:100%;font-size:14px}
.tg .sw{width:46px;height:28px;border-radius:14px;background:var(--s2);position:relative;transition:background .2s}
.tg .sw i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:var(--m);transition:transform .2s,background .2s}
.tg.on .sw{background:var(--w)}
.tg.on .sw i{transform:translateX(18px);background:var(--c)}
#okv{position:fixed;inset:0;z-index:12;background:rgba(20,6,9,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#okv .nx{width:100%;max-width:400px;padding:14px;border-radius:20px;background:var(--s1);border:1px solid var(--ln);display:flex;flex-direction:column;gap:10px;text-align:left}

/* CLIENTES Y FICHA */
.ctop{position:fixed;left:12px;right:12px;top:calc(12px + var(--safe-t));z-index:9;padding:12px;border-radius:24px;background:rgba(43,15,22,.92);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:10px;max-width:540px;margin:0 auto}
.srch{display:flex;align-items:center;gap:10px;height:46px;border-radius:23px;background:var(--bg);border:1px solid var(--ln);padding:0 14px}
.srch input{flex:1;min-width:0;border:0;background:none;color:var(--c);font:inherit;font-size:16px;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--ln);background:var(--bg);color:var(--m);font-size:12px;white-space:nowrap}
.chips button.on{background:var(--w);border-color:var(--w);color:var(--c)}
.zona{position:relative;padding-left:30px}
.zona::before{content:"";position:absolute;left:7px;top:30px;bottom:6px;border-left:2px dashed var(--ln)}
.zh{display:flex;align-items:center;gap:10px;height:36px;margin-left:-30px}
.zh i{width:16px;height:16px;border-radius:8px;background:var(--r);box-shadow:0 0 0 5px rgba(255,77,109,.18);margin-left:1px}
.zh b{font-family:var(--q);font-weight:400;font-size:17px}
.cl{display:flex;align-items:center;gap:10px;padding:8px 0;width:100%;text-align:left}
.av{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-family:var(--q);font-size:15px;flex:none}
.cl .nm{font-size:14px}
.cl .sb{font-size:12px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{position:relative;height:290px;margin:calc(-84px - var(--safe-t)) -20px 0;overflow:hidden;background:var(--s2)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .fd{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,6,9,0) 40%,var(--bg))}
.hero .tx{position:absolute;left:20px;right:20px;bottom:6px;display:flex;flex-direction:column;gap:3px}
.acts3{display:flex;gap:8px}
.acts3 a,.acts3 button{flex:1;height:48px;border-radius:16px;background:var(--s1);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}
.acts3 .pri{background:var(--w);border-color:var(--w)}
.gauges{display:flex;gap:10px}
.gauge{flex:1;padding:12px 8px;border-radius:20px;background:var(--s1);border:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.vis{position:relative;display:flex;gap:12px;padding-bottom:14px;width:100%;text-align:left}
.vis:not(:last-child)::before{content:"";position:absolute;left:7px;top:22px;bottom:0;border-left:2px dashed var(--ln)}
.vis>i{width:16px;height:16px;border-radius:8px;background:var(--r);flex:none;margin-top:3px}
.vis img{width:54px;height:54px;border-radius:10px;object-fit:cover}
</style>
</head>
<body>

<section id="login" class="hide">
<svg class="road" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<path id="lr1" d="M150 860 C 170 600, 260 520, 230 380 S 180 200, 205 -20" stroke="#22090E" stroke-width="70" fill="none"/>
<path id="lr2" d="M150 860 C 170 600, 260 520, 230 380 S 180 200, 205 -20" stroke="#9A898E" stroke-width="3" stroke-dasharray="16 18" fill="none" opacity=".6"/>
</svg>
<div class="glow"></div>
<div class="brand"><img id="llogo" src="../web/img/logo_white.png" alt="GlassDetailingCR"><p id="lslogan">Claridad que<br>se nota</p></div>
<div class="bot">
<span class="m" style="font-size:13px">Tu ruta te espera</span>
<button id="lg" class="gbtn press">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h6a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.4-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.3 9.1 5.4 12 5.4z"/></svg>
Entrar con Google</button>
<div id="lmsg" role="status"></div>
<a href="?demo=1" class="m" style="font-size:13px;min-height:44px;display:flex;align-items:center">Ver con datos de ejemplo</a>
</div>
</section>

<section id="app" class="hide">
<div id="scroll"><div id="road"></div></div>
<div id="top">
<div class="toprow">
<button id="mes" class="press"><span id="mesl"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7A6AB" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<button id="me" class="press" aria-label="Perfil y salir"></button>
</div>
<div id="week" role="tablist" aria-label="Días de la semana"></div>
<div id="net" class="hide"></div>

function renderWeek(){var sel=parse(S.sel),mon=monday(sel),hoy=ymd(new Date()),h="";
  $("mesl").textContent=MESES[sel.getMonth()]+" "+sel.getFullYear();
  for(var i=0;i<7;i++){var d=addDays(mon,i),k=ymd(d),n=S.week.filter(function(p){return p.date===k}).length,dots="";
    for(var j=0;j<Math.min(n,4);j++)dots+="<i></i>";
    h+='<button class="day press'+(k===S.sel?" sel":"")+(k===hoy?" hoy":"")+'" role="tab" aria-selected="'+(k===S.sel)+'" aria-label="'+d.getDate()+" de "+MESES[d.getMonth()]+", "+n+' paradas" data-d="'+k+'"><small>'+DIAS[i]+'</small><b>'+d.getDate()+'</b><span class="dots">'+dots+'</span></button>'}
  $("week").innerHTML=h;
  Array.prototype.forEach.call($("week").children,function(b){b.onclick=function(){pick(b.dataset.d)}})}
function pick(d){if(d===S.sel)return;var oldMon=ymd(monday(parse(S.sel)));S.sel=d;if(ymd(monday(parse(d)))!==oldMon)listen();else{dayFromWeek();renderWeek();renderAll(true)}}
function dayFromWeek(){S.paradas=S.week.filter(function(p){return p.date===S.sel}).sort(function(a,b){return mins(a.time)-mins(b.time)})}

/* RESUMEN */
var shown=0;
function renderSum(){var tot=0,cob=0;S.paradas.forEach(function(p){tot+=p.total||0;if(p.st==="Pagada")cob+=p.total||0});
  var pct=tot?Math.round(cob*100/tot):0;
  $("lde").textContent="de "+crc(tot)+(tot?" · "+pct+" %":"");
  var o={v:shown};gsap.to(o,{v:cob,duration:RM?0:1,ease:"power2.out",onUpdate:function(){$("llev").textContent=crc(o.v)}});shown=cob;
  gsap.to($("barra"),{width:pct+"%",duration:RM?0:1,ease:"power2.out"});
  var pts=S.paradas.filter(function(p){return p.lat!=null&&p.lng!=null}),km=0,prev=HOME;
  pts.forEach(function(p){km+=haversine(prev,p);prev=p});if(pts.length)km+=haversine(prev,HOME);
  km=Math.round(km*1.3);
  $("kwh").innerHTML=pts.length?IC.bat+" "+km+" km ≈ "+Math.round(km*KWH_KM)+" kWh":"";
}

/* LLUVIA (Open-Meteo, gratis y sin registro) */
var RAINC={};
function renderRain(){var d=S.sel,el=$("rain");el.innerHTML="";
  var diff=(parse(d)-parse(ymd(new Date())))/864e5;if(diff<0||diff>6)return;
  if(RAINC[d]){el.innerHTML=RAINC[d];return}
  fetch("https://api.open-meteo.com/v1/forecast?latitude=9.95&longitude=-84.1&hourly=precipitation_probability&timezone=America%2FCosta_Rica&start_date="+d+"&end_date="+d)
  .then(function(r){return r.json()}).then(function(j){var hs=j.hourly.time,pr=j.hourly.precipitation_probability,first=null;
    var from=d===ymd(new Date())?Math.max(8,new Date().getHours()):8;if(from>16){RAINC[d]="";return}
    for(var i=0;i<hs.length;i++){var h=+hs[i].slice(11,13);if(h>=from&&h<=16&&pr[i]>=60){first=h;break}}
    RAINC[d]=first==null?IC.cloud+" Sin lluvia hasta las 4":IC.rain+" Lluvia probable "+(first%12||12)+(first<12?" a. m.":" p. m.");
    if(S.sel===d)el.innerHTML=RAINC[d]}).catch(function(){})}

function renderRoad(anim){var root=$("road"),list=S.paradas,top=$("top").offsetHeight+28,gapS=104,gapN=320,y=top+40,ys=[],h="";

  var H=Math.max(y+140,window.innerHeight);
  root.style.height=H+"px";
  if(!list.length){var ey=top+60;

    root.innerHTML=h;bindSoon(root);if(anim)animIn();return}

function roadSvg(ys,H,nextIdx,carY){var x=60,d="M"+x+" 0",prevY=0;
  function seg(a,b,dir){var q=(b-a)*.25,mid=(a+b)/2,bx=x+36*dir;return " C"+x+" "+(a+q)+" "+bx+" "+(mid-q)+" "+bx+" "+mid+" C"+bx+" "+(mid+q)+" "+x+" "+(b-q)+" "+x+" "+b}
  ys.forEach(function(y,i){d+=seg(prevY,y,i%2?-1:1);prevY=y});
  d+=seg(prevY,H,ys.length%2?-1:1);
  var cut=carY!=null?carY:(nextIdx>0?ys[nextIdx-1]:0);

   '<path d="'+d+'" stroke="#2B0F16" stroke-width="32" fill="none"/>'+
   '<path d="'+d+'" stroke="#7F011F" stroke-width="32" fill="none" opacity=".6" clip-path="url(#past)"/>'+

function nextCard(p,y,isToday){var dm=mins(p.time)-nowMin(),cuando;
  if(!isToday)cuando=hora12(p.time);else if(dm>90)cuando="en "+Math.floor(dm/60)+" h "+(dm%60?dm%60+" min":"");else if(dm>0)cuando="en "+dm+" min";else if(dm>-15)cuando="ahora";else cuando="atrasada "+(-dm)+" min";
  var m=S.mins,mb=[15,30,45].map(function(v){return '<button class="press'+(v===m?" on":"")+'" data-min="'+v+'">'+v+' min</button>'}).join("");

var LOCAL={},STORAGE_OFF=false,IDB=null;
function idb(){return IDB||(IDB=new Promise(function(ok,no){var r=indexedDB.open("gdcr_v2",1);r.onupgradeneeded=function(){r.result.createObjectStore("fotos",{keyPath:"key"})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}))}

function shrink(file){return new Promise(function(ok){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var m=1280,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,m/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){ok(b||file)},"image/jpeg",.78)};img.onerror=function(){ok(file)};img.src=u})}
function addPhotos(p,k,files){Array.prototype.forEach.call(files,function(file){shrink(file).then(function(b){var url=URL.createObjectURL(b);
  if(DEMO){p[k]=(p[k]||[]).concat([url]);refresh();return}
  (LOCAL[p.id+k]=LOCAL[p.id+k]||[]).push(url);refresh();
  idbDo("readwrite",function(st){st.put({key:p.id+"|"+k+"|"+Date.now()+Math.random().toString(36).slice(2,6),id:p.id,k:k,blob:b,url:url})}).then(upload)})})}

function upload(){if(UPLOADING||DEMO||!window.firebase||!firebase.storage||!navigator.onLine||!USER)return;UPLOADING=true;
  idbDo("readonly",function(st){return st.getAll()}).then(function(all){var chain=Promise.resolve();
    (all||[]).forEach(function(it){chain=chain.then(function(){var ref=firebase.storage().ref("r_fotos/"+it.id+"/"+it.key.split("|").slice(1).join("-")+".jpg");
      return ref.put(it.blob,{contentType:"image/jpeg"}).then(function(){return ref.getDownloadURL()}).then(function(u){
        var o={};o[it.k]=firebase.firestore.FieldValue.arrayUnion(u);return DB.collection(COL).doc(it.id).set(o,{merge:true})})
      .then(function(){var l=LOCAL[it.id+it.k];if(l&&it.url){var i=l.indexOf(it.url);if(i>=0)l.splice(i,1)}return idbDo("readwrite",function(st){st.delete(it.key)})})
      .catch(function(){if(!STORAGE_OFF){STORAGE_OFF=true;refresh()}throw "stop"})})});
    return chain}).catch(function(){}).then(function(){UPLOADING=false})}

/* CLIENTES: se arman con todas las paradas, agrupadas por teléfono */

  var hoy=parse(ymd(new Date()));
  return Object.keys(m).map(function(k){var c=m[k];c.ps.sort(function(a,b){return a.date<b.date?1:-1});var last=c.ps[0];c.cli=last.cli;c.tel=last.tel;c.veh=last.veh;c.zona=zonaDe(last);
    c.hechas=c.ps.filter(done);var u=c.hechas[0];c.last=u;c.badge="";c.bc="var(--c)";

      var rep=null;if(s.p||s.v||s.t)rep=addMonths(u.date,11);if(s.f){var rf=addMonths(u.date,12);rep=rep&&rep<rf?rep:rf}

      var gEnd=ends.length?new Date(Math.max.apply(null,ends)):null,dd=gEnd?(gEnd-hoy)/864e5:-999;

function renderCli(){var el=$("vcli"),L=clientes(),con=L.filter(function(c){return c.hechas.length}),rep=con.filter(function(c){return c.hechas.length>1}).length,pct=con.length?Math.round(rep*100/con.length):0;

  var Z={};F.forEach(function(c){(Z[c.zona]=Z[c.zona]||[]).push(c)});

  zk.forEach(function(z){h+='<div class="zona"><div class="zh"><i></i><b>'+esc(z)+'</b><span class="m" style="font-size:12px">'+Z[z].length+' cliente'+(Z[z].length>1?"s":"")+'</span></div>'+
    Z[z].map(function(c){return '<div style="display:flex;align-items:center;gap:8px"><button class="cl press" data-ck="'+esc(c.key)+'"><span class="av" style="background:'+hashC(c.key)+'">'+esc(ini(c.cli))+'</span><span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0"><span class="nm">'+esc(c.cli)+'</span><span class="sb">'+esc(c.veh||"")+(c.badge?' · <span style="color:'+c.bc+'">'+c.badge+'</span>':'')+'</span></span></button>'+

/* FICHA DEL CARRO */

function gaugeSvg(pct){var r=40,cx=50,cy=50,a0=150,a1=390,ae=a0+(a1-a0)*Math.max(0,Math.min(1,pct));
  function pt(a){var t=a*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]}
  var p0=pt(a0),p1=pt(a1),pe=pt(ae);
  return '<svg width="100" height="84" viewBox="0 0 100 84" aria-hidden="true"><path d="M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A40 40 0 1 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+'" stroke="#2B0F16" stroke-width="9" fill="none" stroke-linecap="round"/>'+
   (pct>0?'<path class="gz" d="M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A40 40 0 '+(ae-a0>180?1:0)+' 1 '+pe[0].toFixed(1)+' '+pe[1].toFixed(1)+'" stroke="#FF4D6D" stroke-width="9" fill="none" stroke-linecap="round"/>':'')+
   '<text x="50" y="56" fill="#EDF1F5" font-size="18" text-anchor="middle" font-family="Questrial">'+Math.round(Math.max(0,pct)*100)+'%</text></svg>'}

  '<div class="hero">'+(img?'<img src="'+esc(img)+'" alt="">':'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:.4;transform:scale(2.2)">'+IC.car+'</div>')+'<span class="fd"></span><div class="tx"><span class="q" style="font-size:30px;line-height:1.1">'+esc(c.veh||"Vehículo")+'</span><span class="m" style="font-size:13px">'+esc(c.cli)+(c.zona!=="Sin zona"?" · "+esc(c.zona):"")+'</span></div></div>'+
  '<div class="acts3">'+(c.tel?'<a class="pri press" href="'+esc(waUrl(c,"¡Hola, "+first(c.cli)+"! Le saluda GlassDetailingCR."))+'" target="_blank" rel="noopener">'+IC.wa+' WhatsApp</a>':'')+
  '<a class="press" href="'+esc(wazeUrl(lp))+'" target="_blank" rel="noopener">'+IC.waze+' Waze</a><button class="press" data-soon="Agendar">'+IC.plus+' Agendar</button></div>'+
  (gs?'<div class="gauges">'+gs+'</div>':'')+rep+
  '<div class="sec"><b class="q" style="font-weight:400;font-size:17px">Paradas con nosotros · '+c.ps.length+'</b>'+
  c.ps.map(function(p){var a=photos(p,"fa")[0],d=photos(p,"fd").slice(-1)[0];a=a&&(a.u||a);d=d&&(d.u||d);
    return '<button class="vis press" data-pid="'+esc(p.id)+'"><i></i><span style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0"><span style="font-size:14px">'+esc(p.svc||"Servicio")+'</span><span class="m" style="font-size:12px">'+esc(fmtD(parse(p.date)))+' · '+esc(p.st==="Pagada"?(p.pm||"Pagada"):(p.st||"Pendiente"))+' · '+crc(p.total)+'</span>'+
