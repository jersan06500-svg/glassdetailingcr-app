<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#fff;color:#1F2328;position:relative}
.wrap{position:absolute;inset:44px 48px 92px 52px;display:grid;grid-template-columns:1fr 250px;gap:44px}
h1{font-family:Barlow;font-weight:700;font-size:46px;letter-spacing:.06em;color:#03466E;line-height:1;text-transform:uppercase}
.sub{font-size:15px;color:#5B6470;margin:10px 0 14px;font-weight:500}
.f{display:flex;align-items:flex-end;gap:14px;height:80px;border-bottom:1.5px solid #C9D3DC}
.f b{font-size:13px;font-weight:600;letter-spacing:.14em;color:#0077B6;text-transform:uppercase;padding-bottom:9px;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.side{display:flex;flex-direction:column;gap:14px;border-left:1.5px solid #E3E6EA;padding-left:34px}
.badge{border:1.5px solid #0077B6;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.badge span{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#1F2328}
.badge em{font-style:normal;font-family:Barlow;font-weight:700;font-size:30px;color:#0077B6;line-height:1}
.badge em small{font-size:16px;margin-left:3px}
.qr{display:flex;align-items:center;gap:14px;margin-top:6px}
.qr img{width:104px;height:104px}
.qr p{font-size:14px;line-height:1.35;color:#5B6470;font-weight:500}
.qr p b{display:block;color:#03466E;font-weight:700;font-size:15px}
.foot{position:absolute;left:0;right:0;bottom:0;height:66px;background:#03466E;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 52px}
.foot img{height:40px}
.foot div{font-size:17px;font-weight:600;letter-spacing:.04em}
.foot div span{color:#BFE3F7;font-weight:500;margin-right:10px}
</style></head><body>
<div class="wrap"><div>
<h1>Certificado de garantía</h1><div class="sub">Restauración de focos y parabrisas a domicilio</div>
<div class="f"><b>Cliente</b></div>
<div class="f"><b>Vehículo</b></div>
<div class="f"><b>Servicio</b></div>
<div class="row"><div class="f"><b>Fecha</b></div><div class="f"><b>Válida hasta</b></div></div>
</div>
<div class="side">
<div class="badge"><span>Focos</span><em>5<small>meses</small></em></div>
<div class="badge"><span>Parabrisas</span><em>3<small>meses</small></em></div>
<div class="qr"><img src="qr.png"><p><b>Agende su próxima cita</b>Escanee el código</p></div>
</div></div>
<div class="foot"><div>@glassdetailingcr</div><div><span>WhatsApp</span>7045-8967</div></div>
</body></html>
